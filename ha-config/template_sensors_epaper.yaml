# ──────────────────────────────────────────────────────────────────────
# ePaper Calendar + Weather — Template Sensors
#
# Pre-formats weather data into values that ESPHome can consume
# via sensor/text_sensor. Calendar data comes from input_text helpers
# populated by automations_epaper.yaml.
#
# Required HA integrations:
#   - Google Calendar (calendar.YOUR_CALENDAR_ENTITY)
#   - Weather (weather.forecast_home)
# ──────────────────────────────────────────────────────────────────────

# ── Standard template sensors (polled) ──
- sensor:
    # Current weather temperature (numeric, for formatting in ESPHome)
    - name: "ePaper Weather Temperature"
      unique_id: epaper_weather_temperature
      unit_of_measurement: "°C"
      state: >
        {{ state_attr('weather.forecast_home', 'temperature') | default(0) }}

    # Current weather humidity
    - name: "ePaper Weather Humidity"
      unique_id: epaper_weather_humidity
      unit_of_measurement: "%"
      state: >
        {{ state_attr('weather.forecast_home', 'humidity') | default(0) }}

    # Current wind speed
    - name: "ePaper Weather Wind Speed"
      unique_id: epaper_weather_wind_speed
      unit_of_measurement: "km/h"
      state: >
        {{ state_attr('weather.forecast_home', 'wind_speed') | default(0) }}

# ── Trigger-based template sensor for weather forecast ──
# Runs every 15 minutes and on HA start. Calls weather.get_forecasts
# and stores the next 3 days as a compact string in an input_text helper.
- trigger:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
  action:
    - delay: "00:00:05"
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_response
    - action: input_text.set_value
      target:
        entity_id: input_text.epaper_weather_forecast_data
      data:
        value: >
          {% set forecasts = forecast_response['weather.forecast_home']['forecast'] %}
          {% set result = [] %}
          {% for f in forecasts[:3] %}
            {% set day = as_timestamp(f.datetime) | timestamp_custom('%a') %}
            {% set cond = f.condition | default('unknown') %}
            {% set hi = f.temperature | default(0) | round(0) | string %}
            {% set lo = f.templow | default(0) | round(0) | string %}
            {% set result = result + [day ~ '|' ~ cond ~ '|' ~ hi ~ '|' ~ lo] %}
          {% endfor %}
          {{ result | join(';') }}
  sensor:
    - name: "ePaper Weather Forecast"
      unique_id: epaper_weather_forecast
      state: >
        {{ states('input_text.epaper_weather_forecast_data') }}
