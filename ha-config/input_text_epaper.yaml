# ──────────────────────────────────────────────────────────────────────
# ePaper Calendar + Weather — input_text helpers
#
# Weather forecast data is stored here and read by ESPHome via
# text_sensor. Calendar events are sent directly to the ESPHome
# device via its native API service (no input_text needed).
#
# 1 weather forecast line (format: DAY|COND|HI|LO;DAY|COND|HI|LO;...)
# ──────────────────────────────────────────────────────────────────────
epaper_weather_forecast_data:
  name: "ePaper Weather Forecast Data"
  max: 255
  initial: ""
