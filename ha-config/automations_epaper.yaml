# ──────────────────────────────────────────────────────────────────────
# ePaper Calendar + Weather — Calendar Event Fetching Automation
#
# Runs every 15 minutes to fetch upcoming calendar events for the
# next 7 days and store them in input_text helpers that the ESPHome
# ePaper device can read via text_sensor.
#
# ╔═══════════════════════════════════════════════════════════════════╗
# ║  CHANGE THIS: Replace calendar.familj below       ║
# ║  with your actual Google Calendar entity ID from HA.             ║
# ║  Find it: Settings → Devices & Services → Google Calendar        ║
# ║  Example: calendar.your_email_gmail_com                          ║
# ╚═══════════════════════════════════════════════════════════════════╝
# ──────────────────────────────────────────────────────────────────────
- id: epaper_fetch_calendar_events
  alias: "ePaper - Fetch Calendar Events"
  description: "Periodically fetches Google Calendar events and formats them for the ePaper display"
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:00:10"  # Wait for integrations to be ready on HA start
    - action: calendar.get_events
      target:
        # ┌──────────────────────────────────────────────────────────┐
        # │  ⚠️  CHANGE THIS to your Google Calendar entity ID!     │
        # │  e.g. calendar.your_email_gmail_com                     │
        # └──────────────────────────────────────────────────────────┘
        entity_id: calendar.familj
      data:
        duration:
          days: 7
      response_variable: cal_response
    # Format events into 8 lines (up to 8 events), each line:
    #   TITLE|START_DATE|START_TIME|ALL_DAY
    # e.g.: "Team Standup|2026-07-09|09:00|0"
    #        "Birthday Party|2026-07-10||1"    (all-day, no time)
    - action: input_text.set_value
      target:
        entity_id: input_text.epaper_calendar_line1
      data:
        value: >
          {% set events = cal_response['calendar.familj']['events'] %}
          {% if events | length > 0 %}
            {% set e = events[0] %}
            {% set allday = '1' if e.start is string and 'T' not in e.start else '0' %}
            {% if allday == '1' %}
              {{ e.summary[:40] }}|{{ e.start }}||1
            {% else %}
              {{ e.summary[:40] }}|{{ as_timestamp(e.start) | timestamp_custom('%Y-%m-%d') }}|{{ as_timestamp(e.start) | timestamp_custom('%H:%M') }}|0
            {% endif %}
          {% endif %}
    - action: input_text.set_value
