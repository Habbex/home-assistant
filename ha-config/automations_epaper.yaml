# ──────────────────────────────────────────────────────────────────────
# ePaper Calendar + Weather — 7-Day Timetable Grid Event Fetcher
#
# Runs every 6 hours to fetch upcoming Google Calendar events for
# the week and formats them into a single ;; -delimited string:
#   TITLE|START_DAY|END_DAY|START_HOUR|END_HOUR|ALLDAY;;TITLE|...
#
#   START_DAY / END_DAY: 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun
#   START_HOUR / END_HOUR: Decimal hours (e.g. 9.5 = 09:30, 0.0-24.0)
#
# The packed string is stored in a trigger-based template sensor
# attribute (no 255-char limit). ESPHome reads it via a homeassistant
# text_sensor that auto-syncs on device connect (works with deep sleep).
# ──────────────────────────────────────────────────────────────────────
- id: epaper_fetch_calendar_events
  alias: "ePaper - Fetch Calendar Events"
  description: "Periodically fetches Google Calendar events for the 7-day timetable view"
  mode: single
  triggers:
    - trigger: time_pattern
      hours: "/6"
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:00:05" # Wait for integrations to be ready
    - action: calendar.get_events
      target:
        entity_id: calendar.familj
      data:
        start_date_time: >
          {{ today_at('00:00:00') - timedelta(days=(now().weekday())) }}
        end_date_time: >
          {{ today_at('00:00:00') - timedelta(days=(now().weekday())) + timedelta(days=7) }}
      response_variable: cal_response
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_response
    - action: input_text.set_value
      target:
        entity_id: input_text.epaper_weather_forecast_data
      data:
        value: >
          {% set data = forecast_response.get('weather.forecast_home', {}) %}
          {% set forecasts = data.get('forecast', []) %}
          {% set res = namespace(items=[]) %}
          {% for f in forecasts[:3] %}
            {% set dt = (f.datetime | as_datetime) if f.datetime is defined else none %}
            {% set day = dt.strftime('%a') if dt is not none else 'Day' %}
            {% set cond = f.condition | default('cloudy') %}
            {% set hi = (f.temperature | default(0)) | round(0) | string %}
            {% set lo = (f.templow | default(f.temperature | default(0))) | round(0) | string %}
            {% set res.items = res.items + [day ~ '|' ~ cond ~ '|' ~ hi ~ '|' ~ lo] %}
          {% endfor %}
          {{ res.items | join(';') }}
    # Build all calendar events into a single ;; -delimited string
    # and fire an event to update the template sensor.
    - event: update_epaper_calendar_data
      event_data:
        count: "{{ cal_response['calendar.familj']['events'] | length }}"
        events: >
          {% set events = cal_response['calendar.familj']['events'] %}
          {% set res = namespace(items=[]) %}
          {% for e in events %}
            {% set is_allday = '1' if e.start is string and 'T' not in e.start else '0' %}
            {% if is_allday == '1' %}
              {% set s_ts = as_timestamp(e.start ~ 'T00:00:00') %}
              {% set s_day = (s_ts | timestamp_custom('%w') | int + 6) % 7 %}
              {% set e_ts = as_timestamp(e.end ~ 'T00:00:00') - 86400 %}
              {% set e_day = (e_ts | timestamp_custom('%w') | int + 6) % 7 %}
              {% set e_day = 6 if e_day < s_day and e_ts > s_ts else e_day %}
              {% set item = e.summary[:30] ~ '|' ~ s_day ~ '|' ~ e_day ~ '|0.0|24.0|1' %}
            {% else %}
              {% set s_ts = as_timestamp(e.start) %}
              {% set s_day = (s_ts | timestamp_custom('%w') | int + 6) % 7 %}
              {% set e_ts = as_timestamp(e.end) %}
              {% set e_day = (e_ts | timestamp_custom('%w') | int + 6) % 7 %}
              {% set sh = (s_ts | timestamp_custom('%H') | float) + (s_ts | timestamp_custom('%M') | float) / 60.0 %}
              {% set eh = (e_ts | timestamp_custom('%H') | float) + (e_ts | timestamp_custom('%M') | float) / 60.0 %}
              {% set item = e.summary[:30] ~ '|' ~ s_day ~ '|' ~ e_day ~ '|' ~ (sh | round(2)) ~ '|' ~ (eh | round(2)) ~ '|0' %}
            {% endif %}
            {% set res.items = res.items + [item] %}
          {% endfor %}
          {{ res.items | join(';;') }}
