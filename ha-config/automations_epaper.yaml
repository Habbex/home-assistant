# ──────────────────────────────────────────────────────────────────────
# ePaper Calendar + Weather — 7-Day Timetable Grid Event Fetcher
#
# Runs every 15 minutes to fetch upcoming Google Calendar events for
# the week and formats up to 8 events into structured strings:
#   TITLE|DAY_INDEX|START_HOUR|END_HOUR|ALLDAY
#
#   DAY_INDEX: 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun
#   START_HOUR / END_HOUR: Decimal hours (e.g. 9.5 = 09:30, 0.0-24.0)
# ──────────────────────────────────────────────────────────────────────
- id: epaper_fetch_calendar_events
  alias: "ePaper - Fetch Calendar Events"
  description: "Periodically fetches Google Calendar events for the 7-day timetable view"
  mode: single
  triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
  actions:
    - delay: "00:00:05"  # Wait for integrations to be ready
    - action: calendar.get_events
      target:
        entity_id: calendar.familj
      data:
        duration:
          days: 7
      response_variable: cal_response
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: daily
      response_variable: forecast_response
    - action: input_text.set_value
      target:
        entity_id: input_text.epaper_weather_forecast_data
      data:
        value: >
          {% set data = forecast_response.get('weather.forecast_home', {}) %}
          {% set forecasts = data.get('forecast', []) %}
          {% set res = namespace(items=[]) %}
          {% for f in forecasts[:3] %}
            {% set dt = (f.datetime | as_datetime) if f.datetime is defined else none %}
            {% set day = dt.strftime('%a') if dt is not none else 'Day' %}
            {% set cond = f.condition | default('cloudy') %}
            {% set hi = (f.temperature | default(0)) | round(0) | string %}
            {% set lo = (f.templow | default(f.temperature | default(0))) | round(0) | string %}
            {% set res.items = res.items + [day ~ '|' ~ cond ~ '|' ~ hi ~ '|' ~ lo] %}
          {% endfor %}
          {{ res.items | join(';') }}
    # Format events into 8 input_text lines
    - action: input_text.set_value
      target:
        entity_id: input_text.epaper_calendar_line1
      data:
        value: >
          {% set events = cal_response['calendar.familj']['events'] %}
          {% if events | length > 0 %}
            {% set e = events[0] %}
            {% set is_allday = '1' if e.start is string and 'T' not in e.start else '0' %}
            {% if is_allday == '1' %}
              {% set day_idx = (as_timestamp(e.start ~ 'T00:00:00') | timestamp_custom('%w') | int + 6) % 7 %}
              {{ e.summary[:30] }}|{{ day_idx }}|0.0|24.0|1
            {% else %}
              {% set day_idx = (as_timestamp(e.start) | timestamp_custom('%w') | int + 6) % 7 %}
              {% set sh = (as_timestamp(e.start) | timestamp_custom('%H') | float) + (as_timestamp(e.start) | timestamp_custom('%M') | float) / 60.0 %}
              {% set eh = (as_timestamp(e.end) | timestamp_custom('%H') | float) + (as_timestamp(e.end) | timestamp_custom('%M') | float) / 60.0 %}
              {{ e.summary[:30] }}|{{ day_idx }}|{{ sh | round(2) }}|{{ eh | round(2) }}|0
            {% endif %}
          {% endif %}
