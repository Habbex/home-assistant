# =============================================================================
# ePaper Calendar + Weather Dashboard
#
# Hardware: Seeed XIAO ESP32-S3 Plus + EE02 Driver Board + 13.3" Spectra 6
# Display:  1600×1200, 6 colors (Black, White, Red, Yellow, Blue, Green)
# Driver:   acegallagher/esphome-bigink custom component (dual-controller SPI)
#
# Data sources:
#   - Google Calendar events via HA input_text helpers
#   - Weather from weather.forecast_home
#   - Time from HA
#
# https://github.com/acegallagher/esphome-bigink
# =============================================================================

esphome:
  name: epaper-calendar
  friendly_name: "ePaper Calendar Dashboard"
  name_add_mac_suffix: false

  platformio_options:
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio
    build_flags:
      - "-DBOARD_HAS_PSRAM"
      - "-mfix-esp32-psram-cache-issue"
    lib_deps:
      - SPI
    lib_ignore:
      - esp_insights
      - esp_rainmaker

  on_boot:
    - priority: -100
      then:
        # ── Read battery voltage (enable ADC → read → disable) ──
        - switch.turn_on: battery_adc_enable
        - delay: 100ms
        - component.update: battery_voltage
        - delay: 50ms
        - switch.turn_off: battery_adc_enable

        - wait_until:
            condition:
              wifi.connected:
            timeout: 20s
        - if:
            condition:
              wifi.connected:
            then:
              - logger.log: "WiFi connected, waiting for HA API..."
              - wait_until:
                  condition:
                    api.connected:
                  timeout: 15s
              - if:
                  condition:
                    api.connected:
                  then:
                    - logger.log: "HA API connected. Syncing data..."
                    - delay: 5s
                    - logger.log: "Updating ePaper display..."
                    - component.update: epaper_display
                    - delay: 2s
                    - deep_sleep.enter: deep_sleep_control
                  else:
                    - logger.log: "HA API timeout — updating display with cached data"
                    - component.update: epaper_display
                    - delay: 5s
                    - deep_sleep.enter: deep_sleep_control
            else:
              - logger.log: "WiFi timeout — showing fallback"
              - component.update: epaper_display
              - delay: 5s
              - deep_sleep.enter: deep_sleep_control

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  framework:
    type: arduino

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret epaper_api

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  fast_connect: true
  # Captive portal + fallback AP removed — drains battery if WiFi fails.
  # Device will enter deep sleep on WiFi failure instead.

# Globals section removed — prev_battery_voltage no longer needed
# after charging detection was simplified.


# ── Custom component: bigink display driver ──
# The EE02 board has dual SPI controllers (master/slave) that the
# standard ESPHome epaper_spi component cannot handle. This custom
# component provides the driver.
external_components:
  - source:
      type: git
      url: https://github.com/acegallagher/esphome-bigink
      ref: main
      path: bigink_component
    components: [seeed_epaper_spectra6]

# ── Battery ADC Enable Switch (GPIO6) ──
switch:
  - platform: gpio
    pin: GPIO6
    id: battery_adc_enable
    restore_mode: ALWAYS_OFF

# ── Time source ──
time:
  - platform: homeassistant
    id: ha_time

# ── Weather & Battery Sensors ──
sensor:
  - platform: adc
    pin: GPIO1
    name: "ePaper Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    attenuation: 11db
    filters:
      - multiply: 2.0

  - platform: copy
    source_id: battery_voltage
    name: "ePaper Battery Level"
    id: battery_percentage
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      # Pass voltage through directly — charging detection is handled
      # separately by the battery_charging binary sensor.
      - calibrate_linear:
          - 3.2 -> 0
          - 4.2 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: homeassistant
    id: ha_weather_temp
    entity_id: weather.forecast_home
    attribute: temperature
    accuracy_decimals: 0

  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: weather.forecast_home
    attribute: humidity
    accuracy_decimals: 0

  - platform: homeassistant
    id: ha_weather_wind
    entity_id: weather.forecast_home
    attribute: wind_speed
    accuracy_decimals: 0

text_sensor:
  # Current weather condition (sunny, cloudy, rainy, etc.)
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.forecast_home

  # Weather forecast (compact string: "Tue|sunny|23|15;Wed|partlycloudy|27|18;Thu|sunny|27|19")
  - platform: homeassistant
    id: ha_weather_forecast
    entity_id: input_text.epaper_weather_forecast_data
    on_value:
      then:
        - logger.log: "Weather forecast updated from Home Assistant"

  # Calendar events — 8 lines, each: "TITLE|DATE|TIME|ALLDAY"
  - platform: homeassistant
    id: cal_line1
    entity_id: input_text.epaper_calendar_line1
  - platform: homeassistant
    id: cal_line2
    entity_id: input_text.epaper_calendar_line2
  - platform: homeassistant
    id: cal_line3
    entity_id: input_text.epaper_calendar_line3
  - platform: homeassistant
    id: cal_line4
    entity_id: input_text.epaper_calendar_line4
  - platform: homeassistant
    id: cal_line5
    entity_id: input_text.epaper_calendar_line5
  - platform: homeassistant
    id: cal_line6
    entity_id: input_text.epaper_calendar_line6
  - platform: homeassistant
    id: cal_line7
    entity_id: input_text.epaper_calendar_line7
  - platform: homeassistant
    id: cal_line8
    entity_id: input_text.epaper_calendar_line8

