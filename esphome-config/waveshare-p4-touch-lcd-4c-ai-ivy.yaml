font:
  - file: "gfonts://Roboto"
    id: roboto_72
    size: 72
  - file: "gfonts://Roboto"
    id: roboto_48
    size: 48
  - file: "gfonts://Roboto"
    id: roboto_36
    size: 36
  - file: "gfonts://Roboto"
    id: roboto_32
    size: 32
  - file: "gfonts://Roboto"
    id: roboto_24
    size: 24
  - file: "gfonts://Roboto"
    id: roboto_18
    size: 18
  # MDI weather icons — codepoints are from MaterialDesignIcons 7.x webfont.
  # If an icon looks wrong, cross-check at materialdesignicons.com.
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf'
    id: mdi_weather_font
    size: 96
    glyphs:
      - "\U000F0590"  # weather-cloudy
      - "\U000F0591"  # weather-fog
      - "\U000F0592"  # weather-hail
      - "\U000F0593"  # weather-lightning
      - "\U000F0594"  # weather-night (clear-night)
      - "\U000F0595"  # weather-partly-cloudy
      - "\U000F0596"  # weather-rainy / pouring
      - "\U000F0597"  # weather-sunny
      - "\U000F0598"  # weather-snowy
      - "\U000F059D"  # weather-windy
      - "\U000F067E"  # weather-lightning-rainy
      - "\U000F067F"  # weather-snowy-rainy

lvgl:
  rotation: 180
  displays:
    - my_display
  buffer_size: 2%
  byte_order: little_endian
  bg_color: 0x000000
  widgets:

    # ---- 1. MAIN UI (hidden at boot) ----
    - obj:
        id: main_screen
        width: 100%
        height: 100%
        bg_color: 0x000000
        border_width: 0
        hidden: true
        widgets:

          # Clock/weather idle screen — visible in state 0
          - obj:
              id: clock_weather_screen
              width: 100%
              height: 100%
              bg_color: 0x000000
              border_width: 0
              hidden: false
              widgets:
                - label:
                    id: clock_label
                    text: "--:--"
                    align: CENTER
                    y: -100
                    text_color: 0xFFFFFF
                    text_font: roboto_72
                - label:
                    id: date_label
                    text: ""
                    align: CENTER
                    y: -10
                    text_color: 0xCCCCCC
                    text_font: roboto_36
                - label:
                    id: weather_icon_label
                    text: ""
                    align: CENTER
                    y: 90
                    text_color: 0xFFFFFF
                    text_font: mdi_weather_font
                - label:
                    id: weather_temp_label
                    text: "-- °C"
                    align: CENTER
                    y: 200
                    text_color: 0xFFFFFF
                    text_font: roboto_48

          # Ivy animation — visible in states 1-3
          - animimg:
              id: state_anim
              align: CENTER
              y: 0
              src: [listening_01, listening_03, listening_05, listening_07, listening_09, listening_11, listening_13]
              duration: 2600ms
              repeat_count: forever
              auto_start: false
              hidden: true

          # Now Playing screen — visible in state 4.
          # text_sensor always writes to now_playing_title so it is always
          # current when this screen becomes visible.
          - obj:
              id: now_playing_screen
              width: 100%
              height: 100%
              align: CENTER
              bg_color: 0x000000
              border_width: 0
              pad_all: 24
              hidden: true
              widgets:
                - label:
                    text: "Now Playing"
                    align: CENTER
                    y: -50
                    text_color: 0x888888
                    text_font: roboto_18
                - label:
                    id: now_playing_title
                    text: ""
                    width: 85%
                    align: CENTER
                    y: 10
                    text_align: CENTER
                    text_color: 0xFFFFFF
                    text_font: roboto_32
                    long_mode: SCROLL_CIRCULAR

    # ---- 2. BOOT UI (visible at boot) ----
    - obj:
        id: boot_screen
        width: 100%
        height: 100%
        bg_color: 0x000000
        border_width: 0
        widgets:
          - spinner:
              id: boot_spinner
              width: 80
              height: 80
              align: CENTER
              spin_time: 1s
              arc_length: 60deg
          - label:
              id: boot_label
              text: "Initializing Hardware..."
              align: CENTER
              y: 100
              text_color: 0xFFFFFF
              text_font: roboto_32

# ------------- Controls -------------
number:
  - platform: template
    name: "Voice Assistant Volume"
    id: va_volume_slider
    min_value: 0.1
    max_value: 1.0
    step: 0.05
    optimistic: true
    initial_value: 0.75
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(board_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING && abs(x - id(board_player).volume) > 0.04;'
            then:
              - media_player.volume_set:
                  id: board_player
                  volume: !lambda "return x;"

  - platform: template
    name: "Music Volume"
    id: music_volume_slider
    min_value: 0.1
    max_value: 1.0
    step: 0.05
    optimistic: true
    initial_value: 0.45
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(board_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING && abs(x - id(board_player).volume) > 0.04;'
            then:
              - media_player.volume_set:
                  id: board_player
                  volume: !lambda "return x;"

button:
  - platform: restart
    name: "Restart AI Screen"