esphome:
  name: waveshare-34-ai-ivy
  friendly_name: WaveShare P4 Touch LCD 4 AI
  name_add_mac_suffix: false
  on_boot:
      priority: -100
      then:
        - lvgl.label.update:
            id: boot_label
            text: "Hardware Initialized..."
        - delay: 1s

        # Wait for WiFi (milestone 1)
        - wait_until:
            wifi.connected:
        - lvgl.label.update:
            id: boot_label
            text: "WiFi: Connected"
        - delay: 400ms

        # Wait for Home Assistant (milestone 2)
        - wait_until:
            api.connected:
        - lvgl.label.update:
            id: boot_label
            text: "Home Assistant: Linked"
        - delay: 400ms

        # THE JUMPSTART FIX:
        # Force the engine to cycle ONCE to clear the I2S/SDIO buffers
        - lvgl.label.update:
            id: boot_label
            text: "Starting Duplex Audio..."
        - micro_wake_word.stop
        - globals.set:
            id: wake_word_running
            value: 'false'
        - delay: 500ms
        - script.execute: safe_wake_word_start

        # Now we wait for the system to settle into the detecting state
        - lvgl.label.update:
            id: boot_label
            text: "AEC & Wake Word: OK"
        - delay: 800ms

        # FINISH: Hide boot, reveal main screen, populate clock, start idle timer
        - lvgl.widget.update:
            id: boot_screen
            hidden: true
        - lvgl.widget.update:
            id: main_screen
            hidden: false
        - script.execute: update_clock_display
        - script.execute: refresh_weather_display
        - script.execute: screen_idle_timer

esp32:
  board: esp32-p4
  flash_size: 32MB
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes
    sdkconfig_options:
          CONFIG_ESP_SYSTEM_PANIC_PRINT_HALT: y
          # ╔══════════════════════════════════════════════════════════════╗
          # ║  DO NOT change SDIO RX mode to RX_NONE or RX_MAX_SIZE.      ║
          # ║  The C6 slave firmware is compiled with streaming mode ON.   ║
          # ║  It batches multiple Wi-Fi packets into one SDIO transfer    ║
          # ║  (observed: 2869–7530 byte batches).                         ║
          # ║  Per-packet modes cap at ESP_RX_BUFFER_SIZE = 1536 bytes     ║
          # ║  (sdio_reg.h:41) and reject all larger batches with          ║
          # ║  "Len from slave[N] exceeds max [1536]" → TCP abort →        ║
          # ║  TTS download fails → pipeline error → device broken.        ║
          # ║  STREAMING_MODE (the default) is the only compatible mode.   ║
          # ╚══════════════════════════════════════════════════════════════╝

logger:
  level: INFO
  hardware_uart: UART0
  # Tag names below are the actual ones in ESPHome 2026.4.x source
  # (media_player.cpp, speaker_media_player.cpp, etc.). NOTE: lines like
  # `[S][media_player]: 'X' >> IDLE` come from aioesphomeapi's client-side
  # state_log_formatter.py — they are NOT device logs and CANNOT be
  # suppressed here. Use `esphome logs --no-states` to hide them.
  logs:
    media_player: WARN
    speaker_media_player: WARN
    speaker_media_player.pipeline: WARN
    audio: WARN
    audio_reader: WARN
    audio.decoder: WARN
    speaker_mixer: WARN
    resampler_speaker: WARN
    speaker: WARN
    i2s_audio: WARN
    i2s_audio.speaker: WARN
    i2s_audio.microphone: WARN
    i2s_duplex: WARN
    i2s_duplex.spk: WARN
    i2s_duplex.mic: WARN
    audio_dac: WARN
    audio_adc: WARN
    esp_aec: WARN
    number: WARN
    homeassistant.text_sensor: WARN
    light: WARN
    sensor: WARN

# Enable Home Assistant API
# NOTE: on_client_connected label update removed — redundant with the
# wait_until: api.connected step in on_boot.
api:
  encryption:
    key: !secret waveshare_api

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  on_connect:
      - lvgl.label.update:
          id: boot_label
          text: "WiFi Connected..."
  ap:
    ssid: "Esp32-P4-Touch-Lcd-4C"
    password: !secret ap_pwd

esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

i2c:
  sda: GPIO7
  scl: GPIO8
  scan: false
  id: internal_i2c

switch:
  - platform: gpio
    pin: GPIO53
    id: pa_ctrl
    restore_mode: ALWAYS_ON

  - platform: template
    name: "Enable Wake Word"
    id: wake_word_toggle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - script.execute: safe_wake_word_start
      - logger.log: "Wake word ENABLED via Home Assistant"
    turn_off_action:
      - script.execute: safe_wake_word_stop
      - logger.log: "Wake word MUTED via Home Assistant"

external_components:
  - source: github://n-IA-hane/intercom-api
    components: [i2s_audio_duplex, esp_aec, audio_processor]

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: internal_i2c
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true
    mic_gain: 24DB

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: internal_i2c
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 24dB

esp_aec:
  id: aec_processor
  sample_rate: 16000
  mode: voip_high_perf
  filter_length: 4

i2s_audio_duplex:
  id: i2s_duplex
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13
  i2s_din_pin: GPIO11
  i2s_dout_pin: GPIO9
  sample_rate: 16000
  output_sample_rate: 16000
  use_stereo_aec_reference: true
  # ring_buffer mode gives better AEC delay alignment than previous_frame.
  # 100 ms matches the original aec_reference_buffer_ms value.
  aec_reference: ring_buffer
  aec_reference_buffer_ms: 100
  # ESP32-P4 is RISC-V; the default dsps_fird_s16 SIMD decimator is
  # unreliable on this core (esp-dsp issues #117/#102). Use the scalar
  # float path instead.
  fir_decimator: custom
  # Move non-DMA audio buffers to PSRAM (~15 KB internal RAM freed,
  # reducing SDIO RX OOM pressure).
  buffers_in_psram: true

microphone:
  - platform: i2s_audio_duplex
    id: mic_raw
    i2s_audio_duplex_id: i2s_duplex
    pre_aec: true

  - platform: i2s_audio_duplex
    id: mic_aec
    i2s_audio_duplex_id: i2s_duplex

speaker:
  - platform: i2s_audio_duplex
    id: hw_speaker
    i2s_audio_duplex_id: i2s_duplex
    sample_rate: 16000

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: va_speaker_mix
        timeout: 500ms
      - id: media_speaker_mix
        timeout: 500ms

  - platform: resampler
    id: music_resampler
    output_speaker: media_speaker_mix
    sample_rate: 16000
    num_channels: 1
    task_stack_in_psram: true

psram:
  speed: 100MHz

esp_ldo:
  - channel: 3
    voltage: 2.5V

# ---- Clock ----
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                lambda: 'return id(current_anim_state) == 0;'
              then:
                - script.execute: update_clock_display

      # Every 5 minutes, wake the display briefly to show date/time/weather.
      # Only fires when idle (state 0) — never interrupts VA or media playback.
      - seconds: 0
        minutes: [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
        then:
          - if:
              condition:
                lambda: 'return id(current_anim_state) == 0;'
              then:
                - light.turn_on: screen_backlight
                - script.execute: update_clock_display
                - script.execute: refresh_weather_display
                - delay: 30s
                - if:
                    condition:
                      lambda: 'return id(current_anim_state) == 0;'
                    then:
                      - light.turn_off: screen_backlight

# ---- Weather temperature from Home Assistant ----
# Verify your entity ID: HA → Settings → Devices & Services → weather integration
sensor:
  - platform: homeassistant
    id: ha_temperature
    entity_id: weather.forecast_home
    attribute: temperature
    on_value:
      then:
        - lvgl.label.update:
            id: weather_temp_label
            text: !lambda |
              if (std::isnan(x)) return std::string("-- °C");
              char buf[16];
              snprintf(buf, sizeof(buf), "%.0f °C", x);
              return std::string(buf);

# ---- Track metadata and weather condition from Home Assistant ----
# Entity ID confirmed from HA device page: media_player.waveshare_p4_touch_lcd_4_ai
# NOTE: No state guard here — we always update the label text regardless of
# current screen state. The label widget is hidden when not in state 4 anyway,
# so there is no visual side effect. The previous guard (current_anim_state == 4)
# was the bug — the sensor fires BEFORE on_play switches to state 4, so the
# label was never populated.
text_sensor:
  - platform: homeassistant
    id: ha_media_title
    entity_id: media_player.waveshare_p4_touch_lcd_4_ai_media_player
    attribute: media_title
    on_value:
      then:
        - lvgl.label.update:
            id: now_playing_title
            text: !lambda |
              return x.empty() ? std::string("Unknown Track") : x;

  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.forecast_home
    on_value:
      then:
        - lvgl.label.update:
            id: weather_icon_label
            text: !lambda |
              if (x == "sunny")            return std::string("\U000F0597");
              if (x == "clear-night")      return std::string("\U000F0594");
              if (x == "partlycloudy")     return std::string("\U000F0595");
              if (x == "cloudy")           return std::string("\U000F0590");
              if (x == "rainy")            return std::string("\U000F0596");
              if (x == "pouring")          return std::string("\U000F0596");
              if (x == "snowy")            return std::string("\U000F0598");
              if (x == "snowy-rainy")      return std::string("\U000F067F");
              if (x == "fog")              return std::string("\U000F0591");
              if (x == "hail")             return std::string("\U000F0592");
              if (x == "lightning")        return std::string("\U000F0593");
              if (x == "lightning-rainy")  return std::string("\U000F067E");
              if (x == "windy" || x == "windy-variant") return std::string("\U000F059D");
              return std::string("\U000F0590");


# ---- Media player ----
media_player:
  - platform: speaker
    id: board_player
    name: "Media Player"
    codec_support_enabled: true
    volume_min: 0.2
    volume_max: 0.8
    volume_increment: 0.05
    buffer_size: 32768
    task_stack_in_psram: true

    # on_play fires for BOTH music and TTS announcements. The va_speaking guard
    # skips the music path during TTS. Wake word is stopped here because
    # mic_raw (pre-AEC) picks up speaker output; running wake word during music
    # causes false triggers. The on_idle handler (below) re-enables it after
    # music stops.
    on_play:
      - if:
          condition:
            lambda: 'return !id(va_speaking);'
          then:
            - script.stop: restart_wakeword_safely
            - script.execute: safe_wake_word_stop
            - if:
                condition:
                  lambda: 'return abs(id(board_player).volume - id(music_volume_slider).state) > 0.04;'
                then:
                  - media_player.volume_set:
                      id: board_player
                      volume: !lambda "return id(music_volume_slider).state;"
            - script.execute:
                id: set_anim_state
                target_state: 4

    announcement_pipeline:
          speaker: va_speaker_mix
          format: WAV
          sample_rate: 16000
          num_channels: 1

    media_pipeline:
          speaker: music_resampler
          format: MP3
          sample_rate: 44100
          num_channels: 2

    on_idle:
      # Return to the clock/weather screen immediately so a wake word
      # during the settle window doesn't find us stuck in state 4.
      - if:
          condition:
            lambda: 'return abs(id(board_player).volume - id(va_volume_slider).state) > 0.04;'
          then:
            - media_player.volume_set:
                id: board_player
                volume: !lambda "return id(va_volume_slider).state;"
      - if:
          condition:
            lambda: 'return !id(va_speaking);'
          then:
            - script.execute:
                id: set_anim_state
                target_state: 0
      - delay: 1s
      - script.execute: restart_wakeword_safely


# ---- Wake Word ----
# Two models in parallel (hey_jarvis + hey_mycroft) — different phoneme
# patterns give two chances to catch the wake word, helpful with a non-native
# accent. mic_raw (pre-AEC) is correct here: the wake word model was trained
# on raw mic audio; AEC post-processing distorts the phoneme characteristics
# and reduces detection accuracy. mic_aec is only for the voice_assistant STT.
# sliding_window_size: 4 — faster detection, less perceived lag.
# probability_cutoff: 0.38 — sensitive at room distance; if music/TV causes
# false triggers, raise toward 0.50.
micro_wake_word:
  id: my_wake_word
  microphone:
    microphone: mic_raw
    gain_factor: 6
  stop_after_detection: false
  models:
    - model: hey_jarvis
      probability_cutoff: 0.38
      sliding_window_size: 4
  vad:
    model: github://esphome/micro-wake-word-models/models/v2/vad.json
    probability_cutoff: 0.40
    sliding_window_size: 4

  on_wake_word_detected:
    then:
      - light.turn_on: screen_backlight
      - script.execute: screen_idle_timer
      - globals.set:
          id: was_playing_media
          value: !lambda "return id(board_player).state == media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;"
      - if:
          condition:
            media_player.is_playing:
              id: board_player
          then:
            - media_player.pause: board_player
            - delay: 600ms
      - voice_assistant.stop
      - logger.log:
          format: "Wake word detected: %s"
          args: ["wake_word.c_str()"]
      - script.execute:
          id: set_anim_state
          target_state: 1
      - script.execute: safe_wake_word_stop
      - delay: 100ms
      - voice_assistant.start:
          wake_word: !lambda return wake_word;


# Global flags
globals:
  - id: was_playing_media
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: wake_word_running
    type: bool
    restore_value: false
    initial_value: 'false'

  # 0=idle/clock  1=listening  2=processing  3=replying(TTS)  4=media playing
  - id: current_anim_state
    type: int
    restore_value: false
    initial_value: '0'

  # True while VA TTS is playing — prevents on_play from switching
  # to the Now Playing view during a spoken response
  - id: va_speaking
    type: bool
    restore_value: false
    initial_value: 'false'

  # True if STT actually heard speech this cycle. Used by on_end to
  # decide whether to resume paused music: silence after wake word →
  # resume; real command → stay paused (TTS reply or new media stream).
  - id: stt_fired_this_cycle
    type: bool
    restore_value: false
    initial_value: 'false'


# ---- Voice Assistant ----
# noise_suppression_level: 4 (max) — WebRTC NS runs at full aggressiveness,
# cutting background room noise and music spill before audio reaches HA STT.
# volume_multiplier: 4.0 — additional software pre-amp on top of the 36dB
# codec gain; gives the most pickup at room distance without distortion.
voice_assistant:
  microphone:
    microphone: mic_aec
    gain_factor: 10
  media_player: board_player
  noise_suppression_level: 4
  auto_gain: 31dBFS
  volume_multiplier: 4.0

  on_client_connected:
    - script.execute: restart_wakeword_safely

  on_client_disconnected:
    - script.execute: safe_wake_word_stop
    - script.execute:
        id: set_anim_state
        target_state: 0

  on_listening:
    - globals.set:
        id: stt_fired_this_cycle
        value: 'false'
    - script.execute:
        id: set_anim_state
        target_state: 1

  on_stt_end:
    - globals.set:
        id: stt_fired_this_cycle
        value: 'true'
    - script.execute: pipeline_watchdog
    - logger.log:
        format: "STT heard: %s"
        args: ["x.c_str()"]
    - script.execute:
        id: set_anim_state
        target_state: 2

  on_tts_start:
    - script.stop: pipeline_watchdog
    - globals.set:
        id: va_speaking
        value: 'true'
    - if:
        condition:
          lambda: 'return abs(id(board_player).volume - id(va_volume_slider).state) > 0.04;'
        then:
          - media_player.volume_set:
              id: board_player
              volume: !lambda "return id(va_volume_slider).state;"
    - logger.log:
        format: "TTS text: %s"
        args: ["x.c_str()"]
    - script.execute:
        id: set_anim_state
        target_state: 3

  on_end:
    - script.execute: screen_idle_timer
    - globals.set:
        id: va_speaking
        value: 'false'
    - if:
        condition:
          lambda: 'return abs(id(board_player).volume - id(va_volume_slider).state) > 0.04;'
        then:
          - media_player.volume_set:
              id: board_player
              volume: !lambda "return id(va_volume_slider).state;"
    # If music was playing when wake word fired AND user never spoke,
    # resume music. Otherwise return to clock screen.
    - if:
        condition:
          lambda: 'return id(was_playing_media) && !id(stt_fired_this_cycle);'
        then:
          - logger.log: "No command — resuming paused music"
          - media_player.play: board_player
          - script.execute:
              id: set_anim_state
              target_state: 4
        else:
          - script.execute:
              id: set_anim_state
              target_state: 0
    - globals.set:
        id: was_playing_media
        value: 'false'
    - delay: 300ms
    - script.execute: restart_wakeword_safely

  on_error:
    - logger.log:
        format: "VA error %d: %s"
        args: ["code", "message.c_str()"]
    - globals.set:
        id: va_speaking
        value: 'false'
    - script.execute:
        id: set_anim_state
        target_state: 0
    - delay: 250ms
    - script.execute: restart_wakeword_safely


script:
  - id: safe_wake_word_start
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(wake_word_running);'
          then:
            - logger.log: "Wake word: starting"
            - globals.set:
                id: wake_word_running
                value: 'true'
            - micro_wake_word.start
          else:
            - logger.log: "Wake word: already running, skipping start"

  - id: safe_wake_word_stop
    mode: single
    then:
      - globals.set:
          id: wake_word_running
          value: 'false'
      - micro_wake_word.stop

  # --- Clock/weather label refresh ---
  # Called on boot, every minute via on_time, and whenever state returns to 0.
  - id: update_clock_display
    mode: single
    then:
      - lvgl.label.update:
          id: clock_label
          text: !lambda |
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: date_label
          text: !lambda |
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("");
            const char* days[]   = {"Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"};
            const char* months[] = {"January","February","March","April","May","June","July","August","September","October","November","December"};
            char buf[40];
            snprintf(buf, sizeof(buf), "%s, %d %s", days[t.day_of_week - 1], t.day_of_month, months[t.month - 1]);
            return std::string(buf);

  # --- Weather label refresh ---
  # Re-reads current sensor states and updates labels. Covers the race where
  # HA pushes initial state before LVGL widgets are ready (during boot) — the
  # on_value callback fires but the update is lost. Called from on_boot after
  # main_screen is revealed, and from the periodic 5-min wake script.
  - id: refresh_weather_display
    mode: single
    then:
      - lvgl.label.update:
          id: weather_temp_label
          text: !lambda |
            float t = id(ha_temperature).state;
            if (std::isnan(t)) return std::string("-- °C");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f °C", t);
            return std::string(buf);
      - lvgl.label.update:
          id: weather_icon_label
          text: !lambda |
            std::string x = id(ha_weather_condition).state;
            if (x == "sunny")            return std::string("\U000F0597");
            if (x == "clear-night")      return std::string("\U000F0594");
            if (x == "partlycloudy")     return std::string("\U000F0595");
            if (x == "cloudy")           return std::string("\U000F0590");
            if (x == "rainy")            return std::string("\U000F0596");
            if (x == "pouring")          return std::string("\U000F0596");
            if (x == "snowy")            return std::string("\U000F0598");
            if (x == "snowy-rainy")      return std::string("\U000F067F");
            if (x == "fog")              return std::string("\U000F0591");
            if (x == "hail")             return std::string("\U000F0592");
            if (x == "lightning")        return std::string("\U000F0593");
            if (x == "lightning-rainy")  return std::string("\U000F067E");
            if (x == "windy" || x == "windy-variant") return std::string("\U000F059D");
            return std::string("\U000F0590");

  # --- Screen state manager ---
  # State 0: clock/weather idle screen
  # State 1: listening animation
  # State 2: processing animation
  # State 3: replying (TTS) animation
  # State 4: Now Playing screen
  - id: set_anim_state
    mode: single
    parameters:
      target_state: int
    then:
      - if:
          condition:
            lambda: 'return id(current_anim_state) != target_state;'
          then:
            - globals.set:
                id: current_anim_state
                value: !lambda 'return target_state;'

            # State 0: show clock/weather, hide everything else
            - if:
                condition:
                  lambda: 'return target_state == 0;'
                then:
                  - lvgl.widget.update:
                      id: now_playing_screen
                      hidden: true
                  - lvgl.widget.update:
                      id: state_anim
                      hidden: true
                  - lvgl.widget.update:
                      id: clock_weather_screen
                      hidden: false
                  - script.execute: update_clock_display

            # States 1-3: show Ivy animation, hide clock and Now Playing
            - if:
                condition:
                  lambda: 'return target_state >= 1 && target_state <= 3;'
                then:
                  - lvgl.widget.update:
                      id: now_playing_screen
                      hidden: true
                  - lvgl.widget.update:
                      id: clock_weather_screen
                      hidden: true
                  - lvgl.widget.update:
                      id: state_anim
                      hidden: false

            - if:
                condition:
                  lambda: 'return target_state == 1;'
                then:
                  - lvgl.animimg.update:
                      id: state_anim
                      src: [listening_01, listening_03, listening_05, listening_07, listening_09, listening_11, listening_13]
                      duration: 2600ms
                      repeat_count: forever
                      auto_start: true

            - if:
                condition:
                  lambda: 'return target_state == 2;'
                then:
                  - lvgl.animimg.update:
                      id: state_anim
                      src: [processing_01, processing_03, processing_05, processing_07, processing_09, processing_11, processing_13]
                      duration: 2600ms
                      repeat_count: forever
                      auto_start: true

            - if:
                condition:
                  lambda: 'return target_state == 3;'
                then:
                  - lvgl.animimg.update:
                      id: state_anim
                      src: [replying_01, replying_03, replying_05, replying_07, replying_09, replying_11, replying_13]
                      duration: 2600ms
                      repeat_count: forever
                      auto_start: true

            # State 4: hide clock and animation, show Now Playing
            - if:
                condition:
                  lambda: 'return target_state == 4;'
                then:
                  - lvgl.widget.update:
                      id: clock_weather_screen
                      hidden: true
                  - lvgl.widget.update:
                      id: state_anim
                      hidden: true
                  - lvgl.widget.update:
                      id: now_playing_screen
                      hidden: false

  - id: restart_wakeword_safely
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            voice_assistant.connected
          then:
            - script.execute: safe_wake_word_start
            - script.execute:
                id: set_anim_state
                target_state: 0
          else:
            - delay: 3s
            - script.execute: restart_wakeword_safely

  - id: screen_idle_timer
    mode: restart
    then:
      - delay: 5min
      - light.turn_off: screen_backlight
      - logger.log: "Screen idle timeout reached. Turning off display."

  - id: pipeline_watchdog
    mode: restart
    then:
      - delay: 12s
      - logger.log: "Watchdog triggered! Audio failed to load. Forcing recovery."
      - globals.set:
          id: va_speaking
          value: 'false'
      - media_player.stop: board_player
      - script.execute:
          id: set_anim_state
          target_state: 0
      - script.execute: restart_wakeword_safely


# rotation: 180 moved to lvgl: block — uses P4 PPA hardware accelerator (ESPHome 2026.4.0)
display:
  - platform: mipi_dsi
    id: my_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-3.4C
    # Pepper's ghost hologram (github.com/veebch/pepper): the pyramid face
    # reflects the source image with a horizontal mirror. Pre-mirror the
    # source on X so text/images read correctly in the reflection.
    # Rotation stays in the lvgl: block (uses P4 PPA). If mirror_x ends up
    # backwards for your setup, try mirror_y: true instead (different
    # pyramid orientations mirror different axes).
    transform:
      mirror_x: true
      mirror_y: false

output:
  - platform: ledc
    pin: GPIO26
    id: display_backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: display_backlight_pwm
    name: "Screen Brightness"
    id: screen_backlight
    restore_mode: ALWAYS_ON

image:
